name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/device-pairing-flow

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    env:
      # The isolated pairing branch embeds its Preview API URL in the APK.
      # Main does not inherit this fallback or any Preview-only backend config.
      EXPO_PUBLIC_DELTA_API_URL: ${{ vars.EXPO_PUBLIC_DELTA_API_URL || (github.ref == 'refs/heads/feat/device-pairing-flow' && 'https://delta-control-git-feat-device-pairing-flow-delta-control.vercel.app') }}
      EXPO_PUBLIC_DELTA_API_TOKEN: ${{ secrets.EXPO_PUBLIC_DELTA_API_TOKEN }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test command parser
        run: npm run test:parser

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-control-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
